name: Build Avang VPN APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download Official LibXray AAR from GitHub Releases
        run: |
          mkdir -p app/libs
          AAR_URL=$(curl -s https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest | grep "browser_download_url.*\.aar" | head -n 1 | cut -d '"' -f 4)
          echo "Downloading LibXray from: $AAR_URL"
          curl -fL "$AAR_URL" -o app/libs/libv2ray.aar
          ls -lh app/libs/libv2ray.aar

      - name: Compile hev-socks5-tunnel Native Libraries via NDK
        run: |
          TMPDIR=$(mktemp -d)
          mkdir -p "$TMPDIR/jni"
          git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel.git "$TMPDIR/jni/hev-socks5-tunnel"
          echo 'include $(call all-subdir-makefiles)' > "$TMPDIR/jni/Android.mk"
          NDK_BIN=$(find "$ANDROID_HOME/ndk" -maxdepth 2 -name "ndk-build" | head -n 1)
          "$NDK_BIN" NDK_PROJECT_PATH="$TMPDIR" APP_BUILD_SCRIPT="$TMPDIR/jni/Android.mk" APP_ABI="arm64-v8a armeabi-v7a" APP_PLATFORM=android-24
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          cp "$TMPDIR/libs/arm64-v8a/libhev-socks5-tunnel.so" app/src/main/jniLibs/arm64-v8a/
          cp "$TMPDIR/libs/armeabi-v7a/libhev-socks5-tunnel.so" app/src/main/jniLibs/armeabi-v7a/

      - name: Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/release.jks
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
          else
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
          fi

      - name: Build Signed Release
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Build Debug Fallback
        if: env.HAS_KEYSTORE != 'true'
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Release
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AvangVPN-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Debug
        if: env.HAS_KEYSTORE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AvangVPN-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
